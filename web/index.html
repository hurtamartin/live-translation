<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Živý překlad</title>
<meta name="description" content="Live translation on your phone: read and listen.">
<meta name="theme-color" content="#10162B">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="preload" href="/fonts/barlow-condensed-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/listener.css">
<script src="/js/theme.js" data-key="lt.theme" data-default="dark"></script>
<script type="module" src="/js/listener.js"></script>
</head>
<body>

<header class="top">
  <svg class="mark" viewBox="0 0 120 120" aria-hidden="true"><circle cx="42.9" cy="60" r="10.8"/><path d="M59.5 40.2A25.8 25.8 0 0 1 59.5 79.8M69.3 28.6A41 41 0 0 1 69.3 91.4"/></svg>
  <h1 id="title">Živý překlad</h1>
  <span class="onair" id="onair" data-state="off"><i aria-hidden="true"></i><span id="onairText"></span></span>
</header>

<div class="banner" id="banner" role="status" hidden><span class="spinner" aria-hidden="true"></span><span id="bannerText"></span></div>

<main class="feed" id="feed" aria-live="polite" aria-relevant="additions text">
  <div class="feed-inner" id="feedInner"></div>
  <div class="empty" id="empty" data-state="connecting">
    <div class="empty-art" aria-hidden="true">
      <svg viewBox="0 0 120 120">
        <circle class="halo" cx="60" cy="60" r="58"/>
        <circle class="dot" cx="42.9" cy="60" r="10.8"/>
        <path class="arc a1" d="M59.5 40.2A25.8 25.8 0 0 1 59.5 79.8"/>
        <path class="arc a2" d="M69.3 28.6A41 41 0 0 1 69.3 91.4"/>
      </svg>
    </div>
    <p class="empty-title" id="emptyTitle"></p>
    <p class="empty-body" id="emptyBody"></p>
  </div>
</main>

<button type="button" class="jump" id="jump" hidden>
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  <span id="jumpText"></span>
</button>

<nav class="dock" id="dock" aria-label="Player" data-audio="idle">
  <div class="dock-inner" id="dockInner">
    <button type="button" class="channel" id="channelBtn" aria-haspopup="dialog">
      <span class="code" id="chCode">··</span>
      <span class="names">
        <span class="native" id="chNative"></span>
        <span class="sub-row">
          <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
          <span class="sub" id="chSub"></span>
        </span>
      </span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" class="play" id="play" data-state="idle">
      <span class="ring" aria-hidden="true"></span>
      <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 5.8v12.4a1 1 0 0 0 1.5.86l10-6.2a1 1 0 0 0 0-1.72l-10-6.2a1 1 0 0 0-1.5.86z" fill="currentColor"/></svg>
      <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
      <span class="visually-hidden" id="playLabel"></span>
    </button>
    <button type="button" class="icon-btn settings-btn" id="settingsBtn" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="10" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span class="visually-hidden" id="settingsLabel"></span>
    </button>
  </div>
</nav>

<dialog class="sheet" id="langSheet" aria-labelledby="langTitle">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="langTitle"></h2>
    <button type="button" class="icon-btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <p id="langHint"></p>
    <ul class="lang-list" id="langList"></ul>
  </div>
</dialog>

<dialog class="sheet" id="settingsSheet" aria-labelledby="settingsTitle">
  <div class="sheet-grip" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="settingsTitle"></h2>
    <button type="button" class="icon-btn" data-close aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    </button>
  </div>
  <div class="sheet-body">
    <section class="set-group">
      <h3 id="sizeLabel"></h3>
      <div class="segmented sizes" id="sizes" role="group" aria-labelledby="sizeLabel"></div>
      <p class="size-preview" id="sizePreview" aria-hidden="true"></p>
    </section>
    <section class="set-group">
      <div class="set-card">
        <label class="switch-row">
          <span class="row-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 10.5h11M4 15h16M4 19.5h8"/></svg></span>
          <span class="row-text"><span id="srcLabel"></span></span>
          <input type="checkbox" class="switch" id="showSrc" role="switch">
        </label>
        <label class="switch-row">
          <span class="row-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8.5 10.5V7.5a3.5 3.5 0 0 1 7 0v3"/></svg></span>
          <span class="row-text"><span id="bgLabel"></span><small id="bgHint"></small></span>
          <input type="checkbox" class="switch" id="bgMode" role="switch">
        </label>
        <label class="switch-row" id="awakeRow">
          <span class="row-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg></span>
          <span class="row-text"><span id="awakeLabel"></span></span>
          <input type="checkbox" class="switch" id="keepAwake" role="switch">
        </label>
      </div>
    </section>
    <section class="set-group">
      <h3 id="themeLabel"></h3>
      <div class="segmented" id="themes" role="group" aria-labelledby="themeLabel">
        <button type="button" data-theme-set="dark"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fill" d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><span></span></button>
        <button type="button" data-theme-set="light"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/></svg><span></span></button>
        <button type="button" data-theme-set="auto"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="2"/><path d="M8.5 20h7M12 16.5V20"/></svg><span></span></button>
      </div>
    </section>
    <section class="set-group">
      <h3 id="shareLabel"></h3>
      <div class="share-card">
        <img id="qr" alt="" width="120" height="120">
        <div class="share-side">
          <p id="shareHint"></p>
          <code id="shareUrl"></code>
          <div class="share-actions">
            <button type="button" class="btn small" id="copyBtn" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8.5" y="8.5" width="11" height="11" rx="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 8.5V6.5a2 2 0 0 0-2-2h-7a2 2 0 0 0-2 2v7a2 2 0 0 0 2 2h2" fill="none" stroke="currentColor" stroke-width="2"/></svg>
              <span id="copyText"></span>
            </button>
            <button type="button" class="btn small" id="shareBtn" hidden>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V4M7.5 8.5L12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span id="shareText"></span>
            </button>
          </div>
        </div>
      </div>
    </section>
    <section class="set-group" id="installGroup" hidden>
      <button type="button" class="btn primary wide" id="installBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5M5 19.5h14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="installText"></span>
      </button>
      <p class="install-ios" id="installIos" hidden></p>
    </section>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
